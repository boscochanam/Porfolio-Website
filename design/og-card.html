<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:#f3f1ec;color:#111110;font-family:"Inter",system-ui,Arial,sans-serif}
.panel{position:absolute;inset:0;background:#111110;clip-path:polygon(720px 0,1200px 0,1200px 630px,600px 630px)}
.cut{position:absolute;inset:0}
.left{position:absolute;left:72px;top:96px;width:580px}
.kicker{font:600 22px/1.2 "Inter",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#4d4a45;margin:0 0 22px}
h1{font:800 118px/.92 "Inter",sans-serif;letter-spacing:-.035em;margin:0 0 34px}
.line{font:400 36px/1.3 "Source Serif 4",Georgia,serif;margin:0;max-width:none}
.photo{position:absolute;left:744px;top:64px;width:132px;height:132px;object-fit:cover;border:1.5px solid #f3f1ec;padding:4px;background:#111110}
.proof{position:absolute;left:744px;top:232px;right:56px;list-style:none;margin:0;padding:0;color:#f3f1ec}
.proof li{padding:14px 0;border-top:1.5px solid #3a3936;font:600 25px/1.25 "Inter",sans-serif;color:#cfcac0}
.proof li:first-child{border-top:0;padding-top:0}
.proof b{display:block;font:800 36px/1.05 "Inter",sans-serif;color:#fff;letter-spacing:-.02em;margin:0 0 4px}
</style>
</head>
<body>
<div class="panel"></div>
<svg class="cut" width="1200" height="630" aria-hidden="true"><line x1="720" y1="0" x2="600" y2="630" stroke="#d01b0b" stroke-width="5"/></svg>
<div class="left">
  <p class="kicker">AI/ML Engineer · Pune, India</p>
  <h1>Bosco<br>Chanam</h1>
  <!-- DRAFT -->
  <p class="line">Computer vision,<br>shipped to real hardware.</p>
</div>
<img class="photo" src="../public/assets/headshot.jpg" alt="" width="132" height="132">
<ul class="proof">
  <li><b>11 stations</b>across 2 plants</li>
  <li><b>&lt;5 ms</b>inference on Jetson</li>
  <li><b>Patent</b>in prep · 1st-author IEEE paper</li>
</ul>
</body>
</html>
